# kidblock — block windows with optional day-of-week
#
# Format:  [days] HH:MM-HH:MM
#   days:  *                (every day)
#          mon|tue|wed|thu|fri|sat|sun
#          range:  mon-thu, fri-sun (sat-mon wraps)
#          list:   sat,sun  or  mon,wed,fri
#          omitted (legacy):  every day, same as *
# Time:  24-hour clock. Use 24:00 to mean midnight (end of day).

# Daily — pre-dinner block (4:30pm - 5:30pm)
* 16:30-17:30

# Every morning — block continues until 7:30am
* 00:00-07:30

# Mon-Thu evenings: 6:45pm until midnight (block continues into next morning via the * rule above)
mon-thu 18:45-24:00

# Fri-Sun evenings: 8:30pm until midnight (block continues into next morning)
fri-sun 20:30-24:00

# Saturday + Sunday — mid-morning block 10am-12noon
sat,sun 10:00-12:00
