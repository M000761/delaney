# kidblock -- per-device whitelist (allowlist)
#
# Domains listed here are the ONLY destinations a whitelist-mode device can
# reach. Mark a device whitelist-mode by appending `mode:whitelist` in
# kidblock-macs.conf.
#
# How it works:
#   dnsmasq watches DNS queries for these domains and (regardless of who asked)
#   adds the resolved IPs to two ipsets (kidblock_allow_v4 and _v6). iptables
#   then DROPS all outbound traffic from each whitelist MAC EXCEPT to IPs in
#   those sets.
#
# Apply with:    sudo /config/scripts/kidblock.sh install-allowlist
# Remove with:   sudo /config/scripts/kidblock.sh uninstall-allowlist
# Check ipsets:  sudo ipset list kidblock_allow_v4
#
# Caveats (READ THIS):
#   - Modern sites pull assets from many CDN domains. e.g. khanacademy.org
#     also fetches from kastatic.org / kasandbox.org. If you allowlist only
#     "khanacademy.org" the page will partially load. Add the CDN domains
#     too, or use the UI Allowlist pane to add them as you discover gaps.
#   - DoH (Chrome / Firefox / iOS+Android Private DNS) bypasses dnsmasq, so
#     allowlisted domains never get their IPs populated into the ipset and
#     the device can't reach them. Same fix as blocklist-mode: force LAN DNS
#     to the router via NAT rule 4000 (see top-level README.md).
#   - Schedule full-block windows (kidblock-schedule.conf) still apply --
#     during a block window even whitelist-allowed traffic is dropped.

