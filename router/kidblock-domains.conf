# kidblock — per-device domain blocklist
#
# Domains listed here will be blocked ONLY for the MACs in kidblock-macs.conf.
# Other devices on the network are completely unaffected.
#
# How it works:
#   dnsmasq watches DNS queries for these domains and (regardless of who asked)
#   adds the resolved IPs to two ipsets (kidblock_domains_v4 and _v6). iptables
#   then drops outbound packets from the controlled MAC(s) destined for any IP
#   in those sets.
#
# Apply with:    sudo /config/scripts/kidblock.sh install-domains
# Remove with:   sudo /config/scripts/kidblock.sh uninstall-domains
# Check ipsets:  sudo ipset list kidblock_domains_v4
#
# Caveats:
#   - Works only if the device queries DNS through this router. DoH (Chrome,
#     Firefox, iOS/Android Private DNS) bypasses this.
#   - IPs are populated on demand; cached IPs on the device may keep working
#     briefly after install — flush DNS on the device to speed it up.
#   - CDN IPs can be shared across services; occasional collateral may occur.

