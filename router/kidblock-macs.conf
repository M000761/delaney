# kidblock — controlled devices
#
# One MAC address per line. Comments start with '#'.
# Format: aa:bb:cc:dd:ee:ff   [Label or hostname]   [mode:blocklist|whitelist]
#
# Default mode (no trailing mode:xxx token) is blocklist:
#   device reaches EVERYTHING except IPs resolved from domains in
#   kidblock-domains.conf.
#
# mode:whitelist (DM6):
#   device reaches NOTHING except IPs resolved from domains in
#   kidblock-allowlist.conf. Use for homework-hour devices.
#
# To find MACs of devices currently connected to your router:
#   ssh ubnt@192.168.200.1 'show dhcp leases'
#
# Changes take effect on the next 1-minute tick, or immediately if you run:
#   sudo /config/scripts/kidblock.sh reapply

